# ============================================================
# INTSOLCOM — nginx site config for Contabo VPS
# Copy to /etc/nginx/sites-available/intsolcom and symlink:
#   sudo ln -s /etc/nginx/sites-available/intsolcom /etc/nginx/sites-enabled/intsolcom
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: nginx ignores .htaccess — all security headers and
# file blocks for the PHP version MUST live here.
# ============================================================

# ── HTTP → HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name intsolcom.com www.intsolcom.com;
    return 301 https://intsolcom.com$request_uri;
}

# ── HTTPS ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intsolcom.com www.intsolcom.com;

    # Certbot-managed certificates (run: sudo certbot --nginx -d intsolcom.com -d www.intsolcom.com)
    ssl_certificate     /etc/letsencrypt/live/intsolcom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intsolcom.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/intsolcom/Sitio\ Web;
    index index.php index.html;

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.youtube.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://marcasbpo.com https://app.wontia.com" always;

    # ── Block sensitive files and paths ─────────────────────
    location ~ ^/(includes|tests|scripts|\.git)/ { deny all; }
    location ~ ^/(test_.*|check_.*)\.php$ { deny all; }
    location ~ \.(sql|md|sh|bak|env|log|htpasswd)$ { deny all; }
    location ~ /(config\.php|db-install\.php)$ { deny all; }
    location = /docker-compose.yml { deny all; }
    location = /Dockerfile { deny all; }

    # ── Uploads: never execute PHP ──────────────────────────
    location ^~ /assets/uploads/ {
        location ~ \.php$ { deny all; }
        expires 6M;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # ── Static assets caching ───────────────────────────────
    location ^~ /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # ── API v2 (direct PHP-FPM, no rewrites) ────────────────
    location /api/v2/ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param HTTPS on;
    }

    # ── Blog REST API ───────────────────────────────────────
    location /api/blog {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/blog.php;
        fastcgi_param HTTPS on;
    }

    # ── Widget static ───────────────────────────────────────
    location /widget/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ── PHP pages ───────────────────────────────────────────
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTPS on;
    }

    # ── Pretty URLs (same logic as .htaccess) ───────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(holding|business-units|technology|industries|resources|contact|admin|blog|blog/.*|technology/.*|industries/.*|resources/.*|business-units/.*|nearshore-development|privacy|terms|sitemap\.xml)$ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Gzip ────────────────────────────────────────────────
    gzip on;
    gzip_types text/css application/javascript application/json text/plain text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 12M;
}
